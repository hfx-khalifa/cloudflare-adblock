name: Update Cloudflare AdBlock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download HaGeZi Pro
        run: |
          curl -fsSL \
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt" \
            -o hagezi.txt

      - name: Convert to domains
        run: |
          python3 - <<'PY'
          import re

          domains = set()

          with open("hagezi.txt", encoding="utf-8", errors="ignore") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith(("!", "#", "[")):
                      continue

                  m = re.match(r"^\|\|([A-Za-z0-9.-]+)\^", line)

                  if m:
                      domain = m.group(1).lower()

                      if "." in domain and not domain.startswith("."):
                          domains.add(domain)

          with open("domains.txt", "w", encoding="utf-8") as f:
              for domain in sorted(domains):
                  f.write(domain + "\n")

          print("Domains:", len(domains))
          PY

      - name: Update Cloudflare Gateway List
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_LIST_ID: ${{ secrets.CF_LIST_ID }}
        run: |
          python3 - <<'PY'
          import json

          with open("domains.txt", encoding="utf-8") as f:
              domains = [x.strip() for x in f if x.strip()]

          with open("items.json", "w", encoding="utf-8") as f:
              json.dump(
                  [{"value": d} for d in domains],
                  f,
                  separators=(",", ":")
              )

          print("Items:", len(domains))
          PY

          curl -fsS \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/gateway/lists/${CF_LIST_ID}/items" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @items.json \
            -o response.json

          cat response.json

          python3 - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data.get("success"):
              print("Cloudflare API failed:")
              print(json.dumps(data, indent=2))
              raise SystemExit(1)

          print("Cloudflare Gateway list updated successfully.")
          PY
