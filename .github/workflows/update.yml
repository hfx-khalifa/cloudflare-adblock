      - name: Update Cloudflare Gateway List
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_LIST_ID: ${{ secrets.CF_LIST_ID }}
        run: |
          python3 - <<'PY'
          import json

          with open("domains.txt", encoding="utf-8") as f:
              domains = [x.strip() for x in f if x.strip()]

          with open("items.json", "w", encoding="utf-8") as f:
              json.dump(
                  [{"value": d} for d in domains],
                  f,
                  separators=(",", ":")
              )

          print("Items:", len(domains))
          PY

          curl -fsS \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/gateway/lists/${CF_LIST_ID}/items" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @items.json \
            -o response.json

          cat response.json

          python3 - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data.get("success"):
              print("Cloudflare API failed:")
              print(json.dumps(data, indent=2))
              raise SystemExit(1)

          print("Cloudflare Gateway list updated successfully.")
          PY
